# =============================================================================
# GRIP Basketball — RPi #3 (grip-db): Dedicated PostgreSQL 16 ARM64 Node
# Hardware target: Raspberry Pi 4B (4GB RAM / 32GB microSD)
# =============================================================================
services:
  grip-db:
    image: postgres:16-alpine
    container_name: grip-db
    restart: always
    environment:
      POSTGRES_DB: ${GRIP_DB_NAME:-gripdb}
      POSTGRES_USER: ${GRIP_DB_USER:-grip}
      POSTGRES_PASSWORD: ${GRIP_DB_PASSWORD:-GripRpiCluster2026!}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    ports:
      - "${GRIP_DB_PORT:-5432}:5432"
    volumes:
      - /opt/grip/data/postgres:/var/lib/postgresql/data
      - ../config/postgresql.rpi4.conf:/etc/postgresql/postgresql.conf:ro
      - /opt/grip/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GRIP_DB_USER:-grip} -d ${GRIP_DB_NAME:-gripdb}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
