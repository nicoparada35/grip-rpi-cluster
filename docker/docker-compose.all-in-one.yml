# =============================================================================
# GRIP Basketball — All-in-One Mode (Single Raspberry Pi 4B 4GB Portable Stack)
# Runs DB + Backend + Mailpit + Live-Sync + Nginx on 1 Raspberry Pi
# =============================================================================
services:
  grip-db:
    image: postgres:16-alpine
    container_name: grip-db
    restart: always
    environment:
      POSTGRES_DB: ${GRIP_DB_NAME:-gripdb}
      POSTGRES_USER: ${GRIP_DB_USER:-grip}
      POSTGRES_PASSWORD: ${GRIP_DB_PASSWORD:-GripRpiCluster2026!}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${GRIP_DB_PORT:-5432}:5432"
    volumes:
      - /opt/grip/data/postgres:/var/lib/postgresql/data
      - /opt/grip/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GRIP_DB_USER:-grip} -d ${GRIP_DB_NAME:-gripdb}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - grip-aio-net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  grip-mailpit:
    image: axllent/mailpit:latest
    container_name: grip-mailpit
    restart: always
    ports:
      - "${GRIP_MAILPIT_UI_PORT:-8025}:8025"
      - "${GRIP_MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - grip-aio-net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  grip-backend:
    build:
      context: ../submodules/grip-basketball-fullstack/backend
      dockerfile: Dockerfile
    image: grip-basketball/backend:rpi-arm64
    container_name: grip-backend
    restart: always
    depends_on:
      grip-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: rpi
      GRIP_DB_URL: jdbc:postgresql://grip-db:5432/${GRIP_DB_NAME:-gripdb}
      GRIP_DB_USER: ${GRIP_DB_USER:-grip}
      GRIP_DB_PASSWORD: ${GRIP_DB_PASSWORD:-GripRpiCluster2026!}
      GRIP_JWT_SECRET: ${GRIP_JWT_SECRET:-GRIP_RPI4_CLUSTER_LOCAL_SECRET_KEY_2026_64_BYTES_MINIMUM_SECURITY}
      GRIP_ADMIN_EMAIL: ${GRIP_ADMIN_EMAIL:-admin@gripbasketball.com}
      GRIP_ADMIN_PASSWORD: ${GRIP_ADMIN_PASSWORD:-GripAdmin2026!}
      GRIP_FRONTEND_URL: ${GRIP_FRONTEND_URL:-http://grip.local}
      GRIP_AUTO_VERIFY_LOCAL: ${GRIP_AUTO_VERIFY_LOCAL:-true}
      GRIP_SMTP_HOST: grip-mailpit
      GRIP_SMTP_PORT: "1025"
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+UseG1GC"
    ports:
      - "${GRIP_BACKEND_PORT:-8080}:8080"
    networks:
      - grip-aio-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grip-livesync:
    build:
      context: .
      dockerfile: Dockerfile.livesync
    image: grip-basketball/livesync:rpi-arm64
    container_name: grip-livesync
    restart: always
    depends_on:
      - grip-backend
    environment:
      GRIP_FRONTEND_DIR: /app/frontend
      GRIP_DATA_DIR: /app/data
      GRIP_BACKEND_HOST: grip-backend
      GRIP_BACKEND_PORT: "8080"
    volumes:
      - ../submodules/grip-basketball-fullstack/frontend:/app/frontend:ro
      - ../submodules/grip-basketball-fullstack/scripts:/app/scripts:ro
      - /opt/grip/data/court:/app/data
    ports:
      - "${GRIP_LIVESYNC_PORT:-5500}:5500"
    networks:
      - grip-aio-net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  grip-frontend:
    build:
      context: ../submodules/grip-basketball-fullstack/frontend
      dockerfile: Dockerfile
    image: grip-basketball/frontend:rpi-arm64
    container_name: grip-frontend
    restart: always
    depends_on:
      - grip-backend
      - grip-livesync
    volumes:
      - ../config/nginx.all-in-one.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/grip/data/court:/usr/share/nginx/html/data:ro
    ports:
      - "${GRIP_WEB_PORT:-80}:80"
    networks:
      - grip-aio-net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  grip-aio-net:
    driver: bridge
