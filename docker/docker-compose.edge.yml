# =============================================================================
# GRIP Basketball — RPi #1 (grip-edge): Nginx Web Portal + Live-Sync Engine
# Hardware target: Raspberry Pi 4B (4GB RAM / 32GB microSD)
# =============================================================================
services:
  grip-livesync:
    build:
      context: .
      dockerfile: Dockerfile.livesync
    image: grip-basketball/livesync:rpi-arm64
    container_name: grip-livesync
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GRIP_FRONTEND_DIR: /app/frontend
      GRIP_DATA_DIR: /app/data
      GRIP_BACKEND_HOST: ${GRIP_APP_HOST:-192.168.0.148}
      GRIP_BACKEND_PORT: "${GRIP_BACKEND_PORT:-8080}"
    volumes:
      - ../submodules/grip-basketball-fullstack/frontend:/app/frontend:ro
      - ../submodules/grip-basketball-fullstack/scripts:/app/scripts:ro
      - /opt/grip/data/court:/app/data
    ports:
      - "${GRIP_LIVESYNC_PORT:-5500}:5500"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5500/api/partidos/live-sync >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - grip-edge-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grip-frontend:
    build:
      context: ../submodules/grip-basketball-fullstack/frontend
      dockerfile: Dockerfile
    image: grip-basketball/frontend:rpi-arm64
    container_name: grip-frontend
    restart: always
    depends_on:
      - grip-livesync
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /opt/grip/config/nginx.rendered.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/grip/data/court:/usr/share/nginx/html/data:ro
    ports:
      - "${GRIP_WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - grip-edge-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional Cloudflare Zero Trust Tunnel for https://gripbasketball.com
  grip-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: grip-tunnel
    restart: always
    depends_on:
      - grip-frontend
    networks:
      - grip-edge-net
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles:
      - tunnel
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  grip-edge-net:
    driver: bridge
