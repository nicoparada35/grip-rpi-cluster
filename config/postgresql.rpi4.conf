# =============================================================================
# PostgreSQL 16 Tuning for Raspberry Pi 4B (4GB RAM / 32GB microSD)
# Balances query throughput with low microSD write amplification
# =============================================================================
listen_addresses = '*'
max_connections = 60

# Memory (Tuned for 4GB RAM dedicated DB node)
shared_buffers = 512MB
effective_cache_size = 1536MB
maintenance_work_mem = 128MB
work_mem = 8MB

# WAL & Checkpoints (Reduce microSD wear by spacing checkpoints)
wal_buffers = 16MB
min_wal_size = 128MB
max_wal_size = 512MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# Storage / Planner (microSD random I/O tuning)
random_page_cost = 1.5
effective_io_concurrency = 50

# Logging (Keep concise for 32GB microSD)
logging_collector = off
log_min_duration_statement = 1000
