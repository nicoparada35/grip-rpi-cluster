server {
    listen 80;
    server_name _ grip.local grip-edge.local localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Real-time Court Endpoints (Live-Sync 3x3 Scoreboard, Sports DB, Transfers, Player Photos)
    # Handled by local grip-livesync container on RPi #1 (Edge)
    location ~ ^/(api/partidos/live-sync|api/partidos/guardar|api/sports-database|api/equipos|api/eventos|api/torneos|api/entrenamientos|api/transferencias|api-local/player-photos) {
        proxy_pass http://grip-livesync:5500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Spring Boot Backend REST API (Proxied to RPi #2: grip-app)
    location /api/ {
        proxy_pass http://__GRIP_APP_HOST__:__GRIP_BACKEND_PORT__/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Healthcheck endpoint for watchdog and CD verification
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","node":"grip-edge"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
